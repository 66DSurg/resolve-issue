# .claude/resolve-issue.yml: an example profile for a hypothetical TypeScript
# monorepo with a Bun backend and a SvelteKit frontend. It lists OVERRIDES only:
# every key left out takes its default from references/project-profile.md.
# First-run discovery writes a file like this one and you correct it.
version: 1
agent_docs: docs/agents/         # tracker, labels and domain layout are read from here

commands:
  install: bun install
  typecheck: cd server && bun run typecheck && cd ../frontend && bun run check
  lint: cd server && bun run lint
  unit: cd server && bun test && cd ../frontend && bun run test
  e2e_isolated: scripts/e2e-isolated.sh --backend-port {backend} --frontend-port {frontend}
  build: cd frontend && bun run build
ci_only: [bun scripts/docs/check_pr_docs_impact.js]
known_flaky: [tests/e2e/upload-large.spec.ts]
ports: {reserved: [5173, 8000], agent_range: [5300, 5399]}
env: {link: [.env, secrets], source: .env.test}
issues: {close_trailer: "Ships: #{n}"}   # main deploys to staging, so do not close on merge
git:
  trailers: ["Co-Authored-By: Claude <noreply@anthropic.com>"]
packs: [ux]
laws:
  - "Migrations that auto-run on production are additive only: no DROP, TRUNCATE or DELETE."
  - "UI controls come from frontend/src/components/ui; never re-implement one on a page."
human: {tests_on: staging}

# ---------------------------------------------------------------------------
# Full key reference. Uncomment a key only when its value differs from the
# default in references/project-profile.md.
#
# project: <name>
# repo:
#   remote: <owner/repo>          # verified with git remote -v
#   main_branch: main             # default: git symbolic-ref refs/remotes/origin/HEAD
#   nested_in_parent: false       # never inherit a parent repo's settings [PF-2]
# agent_docs: <dir or null>       # docs/agents/ if present; read, never copied
# commands:                       # each proven to run; per-package keys allowed
#   install: <cmd>
#   post_install: <cmd or null>   # codegen/sync after install (fresh and control worktrees) [IS-16]
#   typecheck: <cmd>
#   lint: <cmd>
#   unit: <cmd>
#   e2e: <cmd>
#   e2e_isolated: <cmd or null>   # takes spare ports; see references/isolation.md
#   build: <cmd>
#   docs_checks: [<cmd>, ...]
# ci_only: [<cmd>, ...]           # needs a PR/CI context; never a local gate [TG-34]
# known_flaky: [<spec id>, ...]   # the SET; a new failure outside it blocks
# ports:
#   reserved: [<dev ports agents must never use>]
#   agent_range: [<from>, <to>]
# env:
#   link: [<gitignored paths to symlink into each worktree>]
#   source: <env file the tests need, or null>
#   shared_db: false              # true: worktrees share one dev DB [IS-17]
#   fixed_paths: [<fixed log/temp paths in the test runner>]   # [IS-18]
# worktrees_dir: ../<repo>-worktrees
# branch_prefix: fix/
# spec_dir: docs/issues           # 'none' → a scratch directory
# small_spec_file: false          # true: small issues also get a spec file
# packs: []                       # ux, product, data-import, cost, tool-quirks
# docs:
#   changelog: CHANGELOG.md
#   unreleased_heading: "## Unreleased"
#   version_file: VERSION
#   user_docs: [<paths>]
#   dev_docs: [<paths>]
#   adr_dir: <path or null>
#   glossary: <path or null>
#   index: <path that must link new specs/ADRs>
#   design: [<design system / style guide docs>]   # the VIEW lens judges screenshots against these
# issues:
#   tracker: github
#   close_trailer: "Closes #{n}"  # or "Ships: #{n}" when the main line is not production
#   auto_file: true               # false: side-issue drafts go in the summary, unfiled [OR-27]
# labels:                         # role → this repo's label string, only where they differ
#   needs-triage: needs-triage
#   needs-info: needs-info
#   ready-for-agent: ready-for-agent
#   ready-for-human: ready-for-human
#   wontfix: wontfix
#   in-progress: in-progress
#   keep-open: keep-open
# git:
#   subject: "<summary> (#{n})"
#   trailers: ["Co-Authored-By: <agent identity>"]
#   never_stage: [<known stray untracked paths>]
# tiers:                          # see references/cost.md
#   diagnose: {model: <strongest>, effort: high}
#   spec: {model: null, effort: high}
#   plan: {model: null, effort: high}
#   build: {model: <mid>, effort: medium}
#   verify: {model: null, effort: high}
#   repair: {model: null, effort: high}   # one tier above build
#   gates: {model: <mid>, effort: medium}
#   docs: {model: <mid>, effort: medium}
#   harvest: {model: <mid>, effort: medium}
#   _excluded: [<tiers that failed the obey probe>]
# budget:
#   max_concurrent_runs: 3
#   max_parallel_builders: 4
#   e2e_in_worktree: false        # true only if it needs no shared resources
# ranker:
#   cmd: <command reading JSON on stdin, or null for an explicit in-prompt ranking>
# laws: ["<project NON-NEGOTIABLE, numbered for verifiers>"]
# privacy:
#   identifier_patterns: ['<regex for this domain's identifiers>']
# human:
#   tests_on: staging             # where the human dogfoods [CM-4]
#   remote_access: <tunnel cmd or null>  # [CM-5]
